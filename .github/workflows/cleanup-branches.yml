name: Cleanup stale branches

# Deletes daily `claude/*` branches once their work is merged into the default
# branch and they have gone quiet. Runs here rather than from a developer
# machine because branch deletion needs repository write permission, which a
# local or sandboxed session may not have.

on:
  schedule:
    # Mondays at 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      stale_days:
        description: "Delete merged branches older than this many days"
        required: false
        default: "14"
      dry_run:
        description: "Only report what would be deleted"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged, stale claude/* branches
        env:
          STALE_DAYS: ${{ github.event.inputs.stale_days || '14' }}
          # Scheduled runs delete; manual runs default to a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          default_branch="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            default_branch="${{ github.event.repository.default_branch }}"
          fi
          echo "Default branch: $default_branch"
          echo "Stale after: $STALE_DAYS days | Dry run: $DRY_RUN"

          git fetch origin --prune
          cutoff=$(( $(date +%s) - STALE_DAYS * 86400 ))

          merged="$(git branch -r --merged "origin/$default_branch" --format='%(refname:short)')"
          deleted=0

          while read -r ref timestamp; do
            [ -n "$ref" ] || continue
            short="${ref#origin/}"

            if ! printf '%s\n' "$merged" | grep -qx "$ref"; then
              echo "skip $short (not merged)"
              continue
            fi
            if [ "$timestamp" -ge "$cutoff" ]; then
              echo "skip $short (still recent)"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "would delete $short"
            else
              git push origin --delete "$short" && echo "deleted $short"
              deleted=$((deleted + 1))
            fi
          done < <(git for-each-ref \
            --format='%(refname:short) %(committerdate:unix)' \
            refs/remotes/origin/claude/)

          echo "Done. Deleted: $deleted"
