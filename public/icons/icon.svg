<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kindlyo">
  <!--
    The "any" purpose app icon: shown as-is on home screens and install UI.
    Opaque canvas background with the brand heart, padded so it reads well
    inside the browser's own rounded-corner treatment.

    Colours are literal hex copied from src/styles/tokens.css (canvas
    #faf3e7, brand #be5136) because this asset renders outside the document,
    where the stylesheet's custom properties do not exist. Keep them in sync.
  -->
  <rect width="64" height="64" rx="14" fill="#faf3e7" />
  <path
    d="M32 50C22 42.5 14 36.4 14 28.4 14 22.6 18.4 18 23.9 18c3.2 0 6.2 1.6 8.1 4.1 1.9-2.5 4.9-4.1 8.1-4.1 5.5 0 9.9 4.6 9.9 10.4 0 8-8 14.1-18 21.6Z"
    fill="#be5136"
  />
</svg>
